name: contributions

# Refreshes the contribution grid in the header and the tenure block in the experience panel once a day, and regenerates
# README.md from the panels so its alt text stays their exact wording. The bot's own commit carries [skip ci] and the
# actor guard below, so a refresh never triggers another refresh.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/fetch-contributions.mjs culinablaz tools/contributions.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node tools/gen-header.mjs tools assets
      - run: node tools/gen-sections.mjs tools assets
      - run: node tools/gen-readme.mjs assets README.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/contributions.json assets/*.svg README.md
          git diff --cached --quiet || git commit -m "chore: refresh contribution grid [skip ci]"
          git push
